<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дом в лесу — Бесплатная реабилитация</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #2d4a2d;
    --forest-mid: #3d6b3d;
    --forest-light: #5a8f5a;
    --cream: #f5f0e8;
    --warm: #e8ddc8;
    --gold: #b8943f;
    --earth: #7a5c3a;
    --text: #1a2a1a;
    --muted: #5a6a5a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Raleway', sans-serif;
    background: var(--cream);
    color: var(--text);
    overflow-x: hidden;
  }
